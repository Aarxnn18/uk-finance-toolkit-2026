<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Loan Repayment Calculator 2026 | UK Graduate Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-50 text-indigo-900 font-sans min-h-screen">

    <div class="max-w-xl mx-auto py-16 px-6">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-black mb-2">Student Loan <span class="text-indigo-600">Impact</span> 2026</h1>
            <p class="text-indigo-400">Calculate your monthly repayments under the latest thresholds.</p>
        </header>

        <div class="bg-white rounded-3xl p-8 shadow-xl border border-indigo-100">
            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-indigo-300 mb-2 uppercase tracking-widest">Annual Salary (£)</label>
                    <input type="number" id="salary" placeholder="e.g. 35000" class="w-full p-4 bg-indigo-50/50 border border-indigo-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 text-lg font-bold">
                </div>

                <div>
                    <label class="block text-xs font-bold text-indigo-300 mb-2 uppercase tracking-widest">Your Loan Plan</label>
                    <select id="plan" class="w-full p-4 bg-indigo-50/50 border border-indigo-100 rounded-2xl outline-none font-medium">
                        <option value="27295">Plan 2 (Started 2012 - 2023)</option>
                        <option value="25000">Plan 5 (Started 2023 onwards)</option>
                        <option value="20195">Plan 1 (Started before 2012)</option>
                    </select>
                </div>

                <button onclick="calcLoan()" class="w-full bg-indigo-600 text-white font-bold py-5 rounded-2xl hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200">View Repayment Breakdown</button>
            </div>

            <div id="loan-result" class="hidden mt-10 p-6 bg-indigo-900 rounded-3xl text-center text-white">
                <p class="text-indigo-300 text-xs font-bold uppercase tracking-widest mb-2">Estimated Monthly Deduction</p>
                <h2 id="monthly-deduction" class="text-5xl font-black mb-4">£0</h2>
                
                <div class="bg-white/10 p-4 rounded-xl text-sm text-indigo-100 mb-6">
                    That's approx. <span id="annual-total" class="font-bold">£0</span> per year toward your balance.
                </div>

                <a href="https://impact.com" class="block w-full bg-white text-indigo-900 font-bold py-4 rounded-xl hover:bg-indigo-50 transition-colors">Improve Your Monthly Cashflow →</a>
            </div>
        </div>

        <p class="mt-8 text-center text-indigo-300 text-[10px] uppercase font-semibold">Values based on 2025/26 proposed UK repayment thresholds.</p>
    </div>

    <script>
        function calcLoan() {
            const salary = parseFloat(document.getElementById('salary').value);
            const threshold = parseFloat(document.getElementById('plan').value);
            
            if(!salary || salary <= threshold) {
                document.getElementById('monthly-deduction').innerText = "£0";
                document.getElementById('annual-total').innerText = "£0";
            } else {
                const annual = (salary - threshold) * 0.09;
                const monthly = annual / 12;
                document.getElementById('monthly-deduction').innerText = "£" + Math.round(monthly);
                document.getElementById('annual-total').innerText = "£" + Math.round(annual);
            }

            document.getElementById('loan-result').classList.remove('hidden');
        }
    </script>
</body>
</html>
