<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side-Hustle Expense Tracker 2026 | UK Tax Deductions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-slate-900 font-sans min-h-screen">

    <div class="max-w-xl mx-auto py-12 px-6">
        <header class="mb-10">
            <h1 class="text-2xl font-bold text-slate-800">Expense <span class="text-blue-600">Deductor</span> 2026</h1>
            <p class="text-slate-500 text-sm italic">Find out how much of your profit is tax-free.</p>
        </header>

        <div class="bg-white rounded-2xl p-8 shadow-lg border border-slate-200">
            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Total Side-Hustle Income (£)</label>
                    <input type="number" id="totalIncome" placeholder="1200" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 font-semibold">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Postage & Packing</label>
                        <input type="number" id="costs" placeholder="200" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Platform Fees</label>
                        <input type="number" id="fees" placeholder="50" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                    </div>
                </div>

                <button onclick="calcExpenses()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition-all shadow-md">Calculate Taxable Profit</button>
            </div>

            <div id="expense-result" class="hidden mt-8 pt-8 border-t border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-slate-500 font-medium">Allowable Expenses:</span>
                    <span id="total-exp" class="font-bold text-slate-800">£0</span>
                </div>
                <div class="p-6 bg-blue-50 rounded-2xl text-center">
                    <p class="text-blue-600 text-xs font-bold uppercase mb-1">Your Taxable Profit</p>
                    <h2 id="taxable-profit" class="text-4xl font-black text-blue-900">£0</h2>
                </div>
                
                <div class="mt-6">
                    <a href="https://impact.com" class="block w-full bg-slate-900 text-white text-center font-bold py-4 rounded-xl hover:bg-slate-800 transition-colors text-sm">Open a Business Account to Track Expenses Automatically →</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calcExpenses() {
            const income = parseFloat(document.getElementById('totalIncome').value) || 0;
            const costs = parseFloat(document.getElementById('costs').value) || 0;
            const fees = parseFloat(document.getElementById('fees').value) || 0;
            
            const totalExp = costs + fees;
            // Use either actual expenses or the £1000 trading allowance
            const finalExp = Math.max(totalExp, 1000); 
            const taxable = Math.max(0, income - finalExp);

            document.getElementById('total-exp').innerText = "£" + totalExp;
            document.getElementById('taxable-profit').innerText = "£" + Math.round(taxable);
            document.getElementById('expense-result').classList.remove('hidden');
        }
    </script>
</body>
</html>
